<div id="stcr_settings_block" class="stcr-ext-settings">

        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-book-open" aria-hidden="true"></i> 阅读器</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="stcr_topbar_icon_toggle">

            <small class="stcr-ext-settings-hint">隐藏后可从魔杖菜单「阅读器」或 /reader 打开</small>
        </div>
    </div>
</div>
